<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="430" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">RG-1 demo shop — cross-section (48 ft bay)</text>
  <text x="320" y="42" text-anchor="middle" font-size="10" fill="#666">Sized inside BOD2-class kinematics: 14.62 m printable width, 8.53 m height (cobod.com specs)</text>

  <!-- scale: 1 ft = 9 px. Bay 48ft = 432px, from x=104 to x=536. Ground y=390. -->
  <!-- ground -->
  <line x1="60" y1="390" x2="580" y2="390" stroke="#8a7d6b" stroke-width="4"/>
  <!-- slab -->
  <rect x="104" y="384" width="432" height="6" fill="#cfc8bd"/>

  <!-- footings -->
  <rect x="112" y="386" width="34" height="14" fill="#b8b0a4"/>
  <rect x="494" y="386" width="34" height="14" fill="#b8b0a4"/>

  <!-- runway columns (freestanding, inside walls) at 26 ft girder: y = 390-26*9 = 156 -->
  <rect x="124" y="162" width="10" height="222" fill="#4a5a6a"/>
  <rect x="506" y="162" width="10" height="222" fill="#4a5a6a"/>
  <!-- rails -->
  <rect x="117" y="152" width="24" height="10" fill="#2e3d4d"/>
  <rect x="499" y="152" width="24" height="10" fill="#2e3d4d"/>
  <!-- bridge girders (double) -->
  <rect x="129" y="136" width="382" height="16" fill="#35506b"/>
  <text x="320" y="132" text-anchor="middle" font-size="10" fill="#35506b">double-girder bridge, 10-ton CMAA Class C — girder rail elev. ~26 ft</text>

  <!-- hoist trolley + hook -->
  <rect x="296" y="122" width="48" height="14" fill="#8a6d1f"/>
  <line x1="320" y1="152" x2="320" y2="230" stroke="#8a6d1f" stroke-width="2.5"/>
  <path d="M 320 230 q 8 10 0 18 q -8 -8 0 -18" fill="none" stroke="#8a6d1f" stroke-width="3"/>

  <!-- printed cavity walls: 24 ft tall = 216px -> top y = 174 -->
  <g>
    <rect x="104" y="174" width="16" height="210" fill="#7a8f7a"/>
    <rect x="520" y="174" width="16" height="210" fill="#7a8f7a"/>
    <!-- print layer lines -->
    <g stroke="#5d705d" stroke-width="1">
      <line x1="104" y1="194" x2="120" y2="194"/><line x1="104" y1="214" x2="120" y2="214"/>
      <line x1="104" y1="234" x2="120" y2="234"/><line x1="104" y1="254" x2="120" y2="254"/>
      <line x1="104" y1="274" x2="120" y2="274"/><line x1="104" y1="294" x2="120" y2="294"/>
      <line x1="104" y1="314" x2="120" y2="314"/><line x1="104" y1="334" x2="120" y2="334"/>
      <line x1="104" y1="354" x2="120" y2="354"/><line x1="104" y1="374" x2="120" y2="374"/>
      <line x1="520" y1="194" x2="536" y2="194"/><line x1="520" y1="214" x2="536" y2="214"/>
      <line x1="520" y1="234" x2="536" y2="234"/><line x1="520" y1="254" x2="536" y2="254"/>
      <line x1="520" y1="274" x2="536" y2="274"/><line x1="520" y1="294" x2="536" y2="294"/>
      <line x1="520" y1="314" x2="536" y2="314"/><line x1="520" y1="334" x2="536" y2="334"/>
      <line x1="520" y1="354" x2="536" y2="354"/><line x1="520" y1="374" x2="536" y2="374"/>
    </g>
  </g>
  <text x="88" y="280" text-anchor="middle" font-size="10" fill="#5d705d" transform="rotate(-90 88 280)">printed cavity wall — 24 ft (AC509)</text>

  <!-- roof: column stubs above girder line, joists + standing seam at ~29 ft: y = 129 -> roof deck y=104 -->
  <line x1="129" y1="136" x2="129" y2="106" stroke="#5f6e7d" stroke-width="5"/>
  <line x1="511" y1="136" x2="511" y2="106" stroke="#5f6e7d" stroke-width="5"/>
  <rect x="96" y="96" width="448" height="8" fill="#5f6e7d"/>
  <polyline points="96,96 110,90 124,96 138,90 152,96 166,90 180,96 194,90 208,96 222,90 236,96 250,90 264,96 278,90 292,96 306,90 320,96 334,90 348,96 362,90 376,96 390,90 404,96 418,90 432,96 446,90 460,96 474,90 488,96 502,90 516,96 530,90 544,96" fill="none" stroke="#3f4c59" stroke-width="2"/>
  <text x="320" y="82" text-anchor="middle" font-size="10" fill="#3f4c59">standing-seam roof — gantry-erected, Allerion self-perform</text>

  <!-- Whitley pod inside, on slab: 12 ft wide x 10 ft tall = 108x90, near right wall -->
  <rect x="392" y="294" width="108" height="90" fill="#d9c98a" stroke="#8a6d1f" stroke-width="2"/>
  <rect x="404" y="316" width="20" height="26" fill="#f2ead0" stroke="#8a6d1f"/>
  <rect x="436" y="316" width="20" height="26" fill="#f2ead0" stroke="#8a6d1f"/>
  <rect x="466" y="330" width="18" height="54" fill="#b09a55"/>
  <text x="446" y="310" text-anchor="middle" font-size="10" fill="#5a4a10" font-weight="bold">Whitley pod (KIBS)</text>
  <!-- lift points -->
  <circle cx="400" cy="294" r="3" fill="#8a6d1f"/><circle cx="492" cy="294" r="3" fill="#8a6d1f"/>
  <text x="446" y="404" text-anchor="middle" font-size="9" fill="#666">relocatable for life by the building's own crane</text>

  <!-- dimensions -->
  <g stroke="#9a9a94" stroke-width="1" fill="#666" font-size="10">
    <line x1="104" y1="414" x2="536" y2="414"/>
    <line x1="104" y1="409" x2="104" y2="419"/><line x1="536" y1="409" x2="536" y2="419"/>
    <text x="320" y="411" text-anchor="middle">48 ft clear bay (≤ 14.62 m printable width)</text>
    <line x1="560" y1="174" x2="560" y2="384"/>
    <line x1="555" y1="174" x2="565" y2="174"/><line x1="555" y1="384" x2="565" y2="384"/>
    <text x="574" y="282" text-anchor="middle" transform="rotate(-90 574 282)">24 ft eave</text>
  </g>

  <!-- callout: fine positioning -->
  <line x1="344" y1="129" x2="424" y2="60" stroke="#c25b21" stroke-width="1.5"/>
  <rect x="424" y="46" width="196" height="26" fill="#fdf0e6" stroke="#c25b21"/>
  <text x="522" y="57" text-anchor="middle" font-size="9" fill="#7a3812">print carriage docks here in Phase 1:</text>
  <text x="522" y="68" text-anchor="middle" font-size="9" fill="#7a3812">±50 mm servo stage rides crane-grade rails</text>
</svg>
