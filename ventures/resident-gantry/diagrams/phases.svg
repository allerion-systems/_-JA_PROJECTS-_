<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="480" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">RG-1 Resident Gantry — four phases, one set of steel</text>

  <!-- Panel frame template drawn 4x at x offsets 10, 250, 490, 730; panel w=220 h=230 (y 45..275) -->

  <!-- ============ PHASE 0 ============ -->
  <g>
    <rect x="10" y="45" width="220" height="230" fill="#f7f7f5" stroke="#c9c9c4"/>
    <text x="120" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Phase 0 — Resident half first</text>
    <!-- ground -->
    <line x1="25" y1="245" x2="215" y2="245" stroke="#8a7d6b" stroke-width="3"/>
    <!-- footings -->
    <rect x="38" y="238" width="24" height="10" fill="#b8b0a4"/>
    <rect x="178" y="238" width="24" height="10" fill="#b8b0a4"/>
    <!-- runway columns -->
    <rect x="46" y="120" width="8" height="120" fill="#4a5a6a"/>
    <rect x="186" y="120" width="8" height="120" fill="#4a5a6a"/>
    <!-- runway rails -->
    <rect x="40" y="112" width="20" height="8" fill="#2e3d4d"/>
    <rect x="180" y="112" width="20" height="8" fill="#2e3d4d"/>
    <!-- bridge girder -->
    <rect x="50" y="100" width="140" height="12" fill="#35506b"/>
    <!-- nomad kit carriage -->
    <rect x="100" y="88" width="34" height="12" fill="#c25b21"/>
    <text x="117" y="83" text-anchor="middle" font-size="9" fill="#c25b21">nomad kit</text>
    <text x="120" y="262" text-anchor="middle" font-size="10" fill="#444">Runway columns + rails + girder —</text>
    <text x="120" y="273" text-anchor="middle" font-size="10" fill="#444">permanent from day one</text>
  </g>

  <!-- ============ PHASE 1 ============ -->
  <g>
    <rect x="250" y="45" width="220" height="230" fill="#f7f7f5" stroke="#c9c9c4"/>
    <text x="360" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Phase 1 — Print walls</text>
    <line x1="265" y1="245" x2="455" y2="245" stroke="#8a7d6b" stroke-width="3"/>
    <rect x="286" y="120" width="8" height="120" fill="#4a5a6a"/>
    <rect x="426" y="120" width="8" height="120" fill="#4a5a6a"/>
    <rect x="280" y="112" width="20" height="8" fill="#2e3d4d"/>
    <rect x="420" y="112" width="20" height="8" fill="#2e3d4d"/>
    <rect x="290" y="100" width="140" height="12" fill="#35506b"/>
    <rect x="330" y="88" width="34" height="12" fill="#c25b21"/>
    <!-- Z mast + nozzle -->
    <rect x="344" y="100" width="5" height="72" fill="#c25b21"/>
    <!-- printed wall layers (left + right walls, partially printed) -->
    <g fill="none" stroke="#7a8f7a" stroke-width="3">
      <line x1="303" y1="242" x2="317" y2="242"/><line x1="303" y1="236" x2="317" y2="236"/>
      <line x1="303" y1="230" x2="317" y2="230"/><line x1="303" y1="224" x2="317" y2="224"/>
      <line x1="303" y1="218" x2="317" y2="218"/><line x1="303" y1="212" x2="317" y2="212"/>
      <line x1="403" y1="242" x2="417" y2="242"/><line x1="403" y1="236" x2="417" y2="236"/>
      <line x1="403" y1="230" x2="417" y2="230"/><line x1="403" y1="224" x2="417" y2="224"/>
    </g>
    <!-- extrusion bead under nozzle -->
    <circle cx="346" cy="176" r="4" fill="#7a8f7a"/>
    <text x="360" y="262" text-anchor="middle" font-size="10" fill="#444">Carriage compensates crane-tolerance</text>
    <text x="360" y="273" text-anchor="middle" font-size="10" fill="#444">rails to print straight (±5 mm goal)</text>
  </g>

  <!-- ============ PHASE 2 ============ -->
  <g>
    <rect x="490" y="45" width="220" height="230" fill="#f7f7f5" stroke="#c9c9c4"/>
    <text x="600" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Phase 2 — Erect + set modules</text>
    <line x1="505" y1="245" x2="695" y2="245" stroke="#8a7d6b" stroke-width="3"/>
    <rect x="526" y="120" width="8" height="120" fill="#4a5a6a"/>
    <rect x="666" y="120" width="8" height="120" fill="#4a5a6a"/>
    <rect x="520" y="112" width="20" height="8" fill="#2e3d4d"/>
    <rect x="660" y="112" width="20" height="8" fill="#2e3d4d"/>
    <rect x="530" y="100" width="140" height="12" fill="#35506b"/>
    <!-- full printed walls -->
    <rect x="543" y="150" width="12" height="95" fill="#7a8f7a"/>
    <rect x="645" y="150" width="12" height="95" fill="#7a8f7a"/>
    <!-- hoist trolley + hook + suspended module -->
    <rect x="580" y="88" width="30" height="12" fill="#8a6d1f"/>
    <line x1="595" y1="100" x2="595" y2="150" stroke="#8a6d1f" stroke-width="2"/>
    <rect x="565" y="150" width="60" height="34" fill="#d9c98a" stroke="#8a6d1f"/>
    <text x="595" y="171" text-anchor="middle" font-size="9" fill="#5a4a10">Whitley pod</text>
    <!-- module already set -->
    <rect x="560" y="211" width="60" height="34" fill="#d9c98a" stroke="#8a6d1f"/>
    <text x="600" y="262" text-anchor="middle" font-size="10" fill="#444">Gantry = erection crane: roof steel,</text>
    <text x="600" y="273" text-anchor="middle" font-size="10" fill="#444">deck, and volumetric pods. No hydro crane.</text>
  </g>

  <!-- ============ PHASE 3 ============ -->
  <g>
    <rect x="730" y="45" width="220" height="230" fill="#f7f7f5" stroke="#c9c9c4"/>
    <text x="840" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Phase 3 — Permanent crane</text>
    <line x1="745" y1="245" x2="935" y2="245" stroke="#8a7d6b" stroke-width="3"/>
    <rect x="766" y="120" width="8" height="120" fill="#4a5a6a"/>
    <rect x="906" y="120" width="8" height="120" fill="#4a5a6a"/>
    <rect x="760" y="112" width="20" height="8" fill="#2e3d4d"/>
    <rect x="900" y="112" width="20" height="8" fill="#2e3d4d"/>
    <rect x="770" y="100" width="140" height="12" fill="#35506b"/>
    <!-- roof -->
    <rect x="758" y="78" width="164" height="6" fill="#5f6e7d"/>
    <line x1="766" y1="84" x2="766" y2="100" stroke="#5f6e7d" stroke-width="3"/>
    <line x1="914" y1="84" x2="914" y2="100" stroke="#5f6e7d" stroke-width="3"/>
    <!-- walls full height -->
    <rect x="783" y="128" width="12" height="117" fill="#7a8f7a"/>
    <rect x="885" y="128" width="12" height="117" fill="#7a8f7a"/>
    <!-- permanent hoist -->
    <rect x="830" y="88" width="30" height="12" fill="#8a6d1f"/>
    <line x1="845" y1="100" x2="845" y2="190" stroke="#8a6d1f" stroke-width="2"/>
    <path d="M 845 190 q 6 8 0 14 q -6 -6 0 -14" fill="none" stroke="#8a6d1f" stroke-width="2.5"/>
    <!-- pods in service -->
    <rect x="800" y="211" width="46" height="34" fill="#d9c98a" stroke="#8a6d1f"/>
    <text x="840" y="262" text-anchor="middle" font-size="10" fill="#444">Kit demobilized. Load test, OSHA 1910.179.</text>
    <text x="840" y="273" text-anchor="middle" font-size="10" fill="#444">Pods stay relocatable by the crane, for life.</text>
  </g>

  <!-- arrows between panels -->
  <g stroke="#9a9a94" stroke-width="2" fill="#9a9a94">
    <line x1="232" y1="160" x2="246" y2="160"/><polygon points="246,155 246,165 254,160"/>
    <line x1="472" y1="160" x2="486" y2="160"/><polygon points="486,155 486,165 494,160"/>
    <line x1="712" y1="160" x2="726" y2="160"/><polygon points="726,155 726,165 734,160"/>
  </g>
</svg>
