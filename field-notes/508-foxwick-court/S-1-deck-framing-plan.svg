<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1200" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1700" height="1200" fill="#ffffff"/>
  <rect x="20" y="20" width="1660" height="1160" fill="none" stroke="#111" stroke-width="3"/>
  <rect x="30" y="30" width="1640" height="1140" fill="none" stroke="#111" stroke-width="1"/>

  <!-- DD banner -->
  <rect x="560" y="45" width="580" height="34" fill="none" stroke="#b03a2e" stroke-width="2"/>
  <text x="850" y="68" text-anchor="middle" fill="#b03a2e" font-size="16" font-weight="bold">DESIGN DEVELOPMENT — NOT FOR CONSTRUCTION · ALL DIMS V.I.F.</text>

  <text x="60" y="70" font-size="22" font-weight="bold" fill="#111">DECK FRAMING PLAN — PROPOSED</text>
  <text x="60" y="92" font-size="12" fill="#333">BASIS: A-3 v04 OVERLAY 07-14-2026 · HOVER 22311873 · DECK SURFACE +5'-4" ABOVE GRADE AT HOUSE · GGUARD + PORCH COLUMNS BY OTHERS/SEPARATE</text>

  <!-- ===== PLAN VIEW  scale 1 ft = 30 px. Deck 36 x 16 ft => 1080 x 480. Origin x=320,y=180 (house/ledger at top) ===== -->
  <g>
    <!-- house wall -->
    <rect x="260" y="140" width="1200" height="40" fill="#e8e8e8" stroke="#111" stroke-width="2"/>
    <text x="860" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">EXISTING HOUSE — LEDGER 2x10 PT CONT. + FLASHING (KEYNOTE 2, V.I.F.)</text>

    <!-- deck outline -->
    <rect x="320" y="180" width="1080" height="480" fill="none" stroke="#111" stroke-width="3"/>

    <!-- joists @16 OC: 40px spacing, vertical lines from ledger (y=180) to rim (y=660) -->
    <g stroke="#666" stroke-width="1">
      <line x1="360" y1="180" x2="360" y2="660"/><line x1="400" y1="180" x2="400" y2="660"/>
      <line x1="440" y1="180" x2="440" y2="660"/><line x1="480" y1="180" x2="480" y2="660"/>
      <line x1="520" y1="180" x2="520" y2="660"/><line x1="560" y1="180" x2="560" y2="660"/>
      <line x1="600" y1="180" x2="600" y2="660"/><line x1="640" y1="180" x2="640" y2="660"/>
      <line x1="680" y1="180" x2="680" y2="660"/><line x1="720" y1="180" x2="720" y2="660"/>
      <line x1="760" y1="180" x2="760" y2="660"/><line x1="800" y1="180" x2="800" y2="660"/>
      <line x1="840" y1="180" x2="840" y2="660"/><line x1="880" y1="180" x2="880" y2="660"/>
      <line x1="920" y1="180" x2="920" y2="660"/><line x1="960" y1="180" x2="960" y2="660"/>
      <line x1="1000" y1="180" x2="1000" y2="660"/><line x1="1040" y1="180" x2="1040" y2="660"/>
      <line x1="1080" y1="180" x2="1080" y2="660"/><line x1="1120" y1="180" x2="1120" y2="660"/>
      <line x1="1160" y1="180" x2="1160" y2="660"/><line x1="1200" y1="180" x2="1200" y2="660"/>
      <line x1="1240" y1="180" x2="1240" y2="660"/><line x1="1280" y1="180" x2="1280" y2="660"/>
      <line x1="1320" y1="180" x2="1320" y2="660"/><line x1="1360" y1="180" x2="1360" y2="660"/>
    </g>
    <!-- doubled joists flanking stair (C2 / C3 lines) -->
    <g stroke="#111" stroke-width="3">
      <line x1="518" y1="180" x2="518" y2="660"/><line x1="523" y1="180" x2="523" y2="660"/>
      <line x1="1013" y1="180" x2="1013" y2="660"/><line x1="1018" y1="180" x2="1018" y2="660"/>
    </g>
    <text x="345" y="420" font-size="12" fill="#333" transform="rotate(-90 345 420)">2x10 PT JOISTS @ 16" O.C. — SPAN 14'-0" + 2'-0" CANTILEVER</text>

    <!-- drop beam at 14 ft from ledger: y = 180 + 420 = 600 -->
    <g>
      <line x1="310" y1="596" x2="1410" y2="596" stroke="#111" stroke-width="5"/>
      <line x1="310" y1="604" x2="1410" y2="604" stroke="#111" stroke-width="2"/>
      <text x="860" y="590" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">(3)-PLY 2x10 PT DROP BEAM — JOINTS OVER POSTS — V.I.F. W/ PE</text>
    </g>

    <!-- rim at cantilever end -->
    <text x="860" y="678" text-anchor="middle" font-size="12" fill="#333">2x10 PT RIM / BAND — PICTURE-FRAME BLOCKING FOR TREX BORDER</text>

    <!-- blocking row at 7 ft: y=390 -->
    <g stroke="#999" stroke-width="1" stroke-dasharray="6,4"><line x1="320" y1="390" x2="1400" y2="390"/></g>
    <text x="1408" y="394" font-size="11" fill="#666">2x10 BLOCKING @ MID-SPAN</text>

    <!-- posts P1..P7 on beam, 6x6 -->
    <g fill="#fff" stroke="#111" stroke-width="2">
      <rect x="333" y="593" width="14" height="14"/><rect x="510" y="593" width="14" height="14"/>
      <rect x="688" y="593" width="14" height="14"/><rect x="853" y="593" width="14" height="14"/>
      <rect x="1018" y="593" width="14" height="14"/><rect x="1196" y="593" width="14" height="14"/>
      <rect x="1373" y="593" width="14" height="14"/>
    </g>
    <g fill="none" stroke="#1a5276" stroke-width="1.5">
      <circle cx="340" cy="600" r="16"/><circle cx="517" cy="600" r="16"/><circle cx="695" cy="600" r="16"/>
      <circle cx="860" cy="600" r="16"/><circle cx="1025" cy="600" r="16"/><circle cx="1203" cy="600" r="16"/>
      <circle cx="1380" cy="600" r="16"/>
    </g>
    <text x="340" y="640" text-anchor="middle" font-size="11" fill="#1a5276">P1</text>
    <text x="517" y="640" text-anchor="middle" font-size="11" fill="#1a5276">P2</text>
    <text x="695" y="640" text-anchor="middle" font-size="11" fill="#1a5276">P3</text>
    <text x="860" y="640" text-anchor="middle" font-size="11" fill="#1a5276">P4</text>
    <text x="1025" y="640" text-anchor="middle" font-size="11" fill="#1a5276">P5</text>
    <text x="1203" y="640" text-anchor="middle" font-size="11" fill="#1a5276">P6</text>
    <text x="1380" y="640" text-anchor="middle" font-size="11" fill="#1a5276">P7</text>
    <text x="240" y="604" font-size="11" fill="#1a5276">6x6 PT POSTS ON</text>
    <text x="240" y="617" font-size="11" fill="#1a5276">12"Ø x 24" FOOTINGS (F1)</text>

    <!-- GRAND STAIR between C2 (x=518) and C3 (x=1013): width 16.5 ft = 495 px, run 7'-4" = 220px below deck -->
    <g>
      <rect x="520" y="660" width="495" height="220" fill="none" stroke="#111" stroke-width="2"/>
      <!-- stringers @12 OC: 30px spacing -->
      <g stroke="#888" stroke-width="1">
        <line x1="550" y1="660" x2="550" y2="880"/><line x1="580" y1="660" x2="580" y2="880"/>
        <line x1="610" y1="660" x2="610" y2="880"/><line x1="640" y1="660" x2="640" y2="880"/>
        <line x1="670" y1="660" x2="670" y2="880"/><line x1="700" y1="660" x2="700" y2="880"/>
        <line x1="730" y1="660" x2="730" y2="880"/><line x1="760" y1="660" x2="760" y2="880"/>
        <line x1="790" y1="660" x2="790" y2="880"/><line x1="820" y1="660" x2="820" y2="880"/>
        <line x1="850" y1="660" x2="850" y2="880"/><line x1="880" y1="660" x2="880" y2="880"/>
        <line x1="910" y1="660" x2="910" y2="880"/><line x1="940" y1="660" x2="940" y2="880"/>
        <line x1="970" y1="660" x2="970" y2="880"/><line x1="1000" y1="660" x2="1000" y2="880"/>
      </g>
      <!-- tread lines -->
      <g stroke="#444" stroke-width="1">
        <line x1="520" y1="688" x2="1015" y2="688"/><line x1="520" y1="716" x2="1015" y2="716"/>
        <line x1="520" y1="744" x2="1015" y2="744"/><line x1="520" y1="772" x2="1015" y2="772"/>
        <line x1="520" y1="800" x2="1015" y2="800"/><line x1="520" y1="828" x2="1015" y2="828"/>
        <line x1="520" y1="856" x2="1015" y2="856"/>
      </g>
      <text x="767" y="905" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">GRAND STAIR — 16'-6" W (C2–C3) · 9R @ ±7-1/8" · 2x12 PT STRINGERS @ 12" O.C. (18)</text>
      <text x="767" y="922" text-anchor="middle" font-size="11" fill="#b03a2e">STONE NEWEL PIERS + CONC. LANDING BY MASONRY/FLATWORK — NOT IN THIS ORDER</text>
    </g>

    <!-- chimney pad marker between C3-C4 -->
    <rect x="1150" y="620" width="80" height="34" fill="none" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="1190" y="712" text-anchor="middle" font-size="11" fill="#b03a2e">F3 CHIMNEY PAD BELOW DECK</text>
    <text x="1190" y="726" text-anchor="middle" font-size="11" fill="#b03a2e">POINT LOAD — PE DESIGN · SEPARATE POUR</text>

    <!-- column markers C1-C4 at deck edge (porch columns, by others) -->
    <g fill="none" stroke="#1a5276" stroke-width="1.5">
      <circle cx="335" cy="660" r="13"/><circle cx="520" cy="660" r="13"/>
      <circle cx="1015" cy="660" r="13"/><circle cx="1390" cy="660" r="13"/>
    </g>
    <g fill="#1a5276" font-size="11" text-anchor="middle">
      <text x="335" y="664">C1</text><text x="520" y="664">C2</text><text x="1015" y="664">C3</text><text x="1390" y="664">C4</text>
    </g>

    <!-- dimensions -->
    <g stroke="#1a5276" stroke-width="1" fill="#1a5276" font-size="12">
      <line x1="320" y1="960" x2="1400" y2="960"/>
      <line x1="320" y1="950" x2="320" y2="970"/><line x1="1400" y1="950" x2="1400" y2="970"/>
      <text x="860" y="982" text-anchor="middle">36'-0" OVERALL (35'-2" COL–COL + OVERHANGS, V.I.F.)</text>
      <line x1="335" y1="935" x2="520" y2="935"/><line x1="520" y1="935" x2="1015" y2="935"/><line x1="1015" y1="935" x2="1390" y2="935"/>
      <line x1="335" y1="927" x2="335" y2="943"/><line x1="520" y1="927" x2="520" y2="943"/><line x1="1015" y1="927" x2="1015" y2="943"/><line x1="1390" y1="927" x2="1390" y2="943"/>
      <text x="427" y="925" text-anchor="middle">6'-2"</text><text x="767" y="925" text-anchor="middle">16'-6"</text><text x="1202" y="925" text-anchor="middle">12'-6"</text>
      <line x1="1470" y1="180" x2="1470" y2="600"/><line x1="1462" y1="180" x2="1478" y2="180"/><line x1="1462" y1="600" x2="1478" y2="600"/>
      <text x="1488" y="390" transform="rotate(90 1488 390)" text-anchor="middle">14'-0" JOIST SPAN</text>
      <line x1="1470" y1="600" x2="1470" y2="660"/><line x1="1462" y1="660" x2="1478" y2="660"/>
      <text x="1520" y="635" font-size="11">2'-0" CANT.</text>
    </g>
  </g>

  <!-- ===== MATERIAL SCHEDULE ===== -->
  <g font-size="12" fill="#111">
    <text x="60" y="1020" font-size="15" font-weight="bold">FRAMING MATERIAL SCHEDULE — LOWE'S PICKUP (ALL LUMBER PT GROUND-CONTACT)</text>
    <text x="60" y="1042">(30) 2x10x16' JOISTS · (18) 2x10x12' [BEAM 9 / LEDGER 3 / RIM 3 / BLOCKING 3] · (8) 6x6x10' POSTS · (20) 2x12x12' STRINGERS</text>
    <text x="60" y="1060">(32) LUS210 + (2) LUS210-2 HANGERS · (18) LSCZ STAIR CONNECTORS · (9) ABU66Z POST BASES · (7) AC6Z POST CAPS</text>
    <text x="60" y="1078">(2) 500-CT SD9 1-1/2" STRUCTURAL SCREWS · (60) 5/8" LEDGERLOK · (1) BOX GRK #10x3-1/2" · 5 LB 16d HDG NAILS</text>
    <text x="60" y="1096">(20) 80-LB CONCRETE (F1 FOOTINGS ONLY) · (10) BAGS GRAVEL · 36 LF LEDGER FLASHING · (2) 4"x75' FLASH TAPE · (4) JOIST TAPE</text>
    <text x="60" y="1121" fill="#b03a2e" font-weight="bold">EXCLUDED: F3 CHIMNEY PAD + STAIR LANDING (SEPARATE POUR) · PORCH COLUMNS/BEAMS/TRUSS (SIZE PER PE) · TREX + 36" BLACK ALUM. GUARD (SEPARATE ORDERS)</text>
  </g>

  <!-- title block -->
  <g>
    <rect x="1180" y="1000" width="490" height="170" fill="none" stroke="#111" stroke-width="2"/>
    <line x1="1180" y1="1040" x2="1670" y2="1040" stroke="#111"/>
    <line x1="1180" y1="1100" x2="1670" y2="1100" stroke="#111"/>
    <line x1="1560" y1="1000" x2="1560" y2="1170" stroke="#111"/>
    <text x="1195" y="1026" font-size="14" font-weight="bold">ALLERION TECHNOLOGIES LLC</text>
    <text x="1195" y="1062" font-size="12">HERNANDEZ RESIDENCE — 508 Foxwick Ct, Louisville KY</text>
    <text x="1195" y="1082" font-size="12" font-weight="bold">DECK FRAMING PLAN — DESIGN DEVELOPMENT</text>
    <text x="1195" y="1124" font-size="11">BASIS: A-3 v04 OVERLAY 07-14-2026 · V.I.F.</text>
    <text x="1195" y="1144" font-size="11">DECK +5'-4" · JOISTS 2x10 @ 16" O.C. · BEAM (3)2x10</text>
    <text x="1615" y="1075" text-anchor="middle" font-size="30" font-weight="bold">S-1</text>
    <text x="1615" y="1140" text-anchor="middle" font-size="10">v01 · 08-04-2026</text>
  </g>
</svg>
